<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="280" viewBox="0 0 1040 280" role="img" aria-labelledby="title desc">
  <title id="title">缩放补边与检测框坐标还原</title>
  <desc id="desc">853乘363的横图缩放为672乘285，再上下补193和194行。还原检测框时先减去补边，再除以实际缩放比例。</desc>
  <rect width="1040" height="280" rx="16" fill="#f5f8fa"/>
  <g font-family="sans-serif" fill="#203748" text-anchor="middle">
    <text x="170" y="36" font-size="20">原图 853×363</text>
    <rect x="38" y="88" width="264" height="112" rx="5" fill="#a8d8ce"/>
    <rect x="92" y="110" width="110" height="66" fill="none" stroke="#247d69" stroke-width="3"/>
    <text x="170" y="155" font-size="17">图片内容</text>
    <text x="365" y="126" font-size="18">缩放 + 补边 →</text>
    <text x="555" y="36" font-size="20">模型画布 672×672</text>
    <rect x="460" y="50" width="190" height="190" rx="5" fill="#dce5ea"/>
    <rect x="460" y="105" width="190" height="81" fill="#a8d8ce"/>
    <rect x="499" y="121" width="79" height="48" fill="none" stroke="#247d69" stroke-width="3"/>
    <text x="555" y="84" font-size="16">上补193行</text>
    <text x="555" y="155" font-size="16">内容672×285</text>
    <text x="555" y="219" font-size="16">下补194行</text>
    <text x="841" y="107" font-size="21">框画回原图</text>
    <text x="841" y="148" font-size="18">① 减去左侧、上方补边</text>
    <text x="841" y="183" font-size="18">② 除以横、纵缩放比例</text>
    <text x="520" y="267" font-size="14" fill="#526a7a">示意图：尺寸标注对应实验；框形状仅用于说明换算，不是模型预测。</text>
  </g>
</svg>
